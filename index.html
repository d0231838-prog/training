<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14171B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>推拉腿训练本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="训练本">
<style>
/* Layout: a gym logbook — sticky header with four tabs, one column of exercise cards, plate colours mark the day type */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --sunk:#F4F5F7; --ink:#14171B; --muted:#5D6570; --line:#D4D8DE;
  --leg:#1D5DC2; --push:#CF3328; --pull:#B88A00; --cardio:#23845A; --ok:#23845A; --warn:#B86A00; --scrim:rgba(10,12,15,.92);
  --display:"DIN Condensed","Bahnschrift","Roboto Condensed","Arial Narrow",-apple-system,sans-serif;
  --body:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101215; --surface:#1A1D22; --sunk:#14171B; --ink:#ECEEF1; --muted:#99A1AB; --line:#2C3138;
  --leg:#6A9CF2; --push:#FF6253; --pull:#F0C23A; --cardio:#4CC38A; --ok:#4CC38A; --warn:#F0A54A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101215; --surface:#1A1D22; --sunk:#14171B; --ink:#ECEEF1; --muted:#99A1AB; --line:#2C3138;
  --leg:#6A9CF2; --push:#FF6253; --pull:#F0C23A; --cardio:#4CC38A; --ok:#4CC38A; --warn:#F0A54A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;position:-webkit-sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:12px 0;display:grid;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;margin:0;line-height:1}
.brand .plates{display:flex;gap:4px}
.brand .plates i{width:8px;height:22px;border-radius:2px;display:block}
.tabs{display:flex}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:8px 0 9px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
main .wrap{padding-block:16px 120px;display:grid;gap:14px}
.note{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.chip[aria-pressed="true"] .dot{background:#fff}
.chip small{font-size:11px;font-weight:600;opacity:.8}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;-webkit-appearance:none;appearance:none}
input[type="date"]{min-height:42px}
input:focus-visible,textarea:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
textarea{width:100%;min-height:64px;resize:vertical}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;min-width:0}
.ex{border-left:4px solid var(--c);border-radius:4px 12px 12px 4px}
.ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ex-head h3{margin:0;font-size:17px}
.target{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.last{font-size:13px;color:var(--muted);display:grid;gap:2px}
.hint{font-weight:600}
.hint.up{color:var(--ok)} .hint.hold{color:var(--warn)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumb{width:56px;height:56px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);padding:0;overflow:hidden;cursor:pointer;flex:0 0 auto}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.add{border-style:dashed;color:var(--muted);font:inherit;font-size:12px;font-weight:600}
.thumbs.sm .thumb{width:44px;height:44px}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:28px 1fr 14px 1fr 44px;gap:6px;align-items:center}
.set .n{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center}
.set input{width:100%;text-align:center;font-family:var(--display);font-size:20px;font-weight:600;padding:6px 4px;font-variant-numeric:tabular-nums}
.set .x{text-align:center;color:var(--muted)}
.unit{position:relative}
.unit span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none}
.ck{height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-size:18px;cursor:pointer}
.set.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.set.done input{border-color:var(--ok)}
.mini{display:flex;gap:12px;flex-wrap:wrap}
.lnk{background:none;border:0;padding:4px 0;font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.lnk.danger{color:var(--push)}
.btn{border:0;border-radius:10px;padding:13px 16px;font:inherit;font-weight:700;font-size:16px;background:var(--ink);color:var(--bg);cursor:pointer;width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.5}
.sec-title{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.03em;margin:6px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.hist-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:12px;font-weight:700;color:#fff;background:var(--c);border-radius:4px;padding:1px 7px}
.hist ul{margin:0;padding:0;list-style:none;font-size:14px;display:grid;gap:2px}
.hist li{display:flex;justify-content:space-between;gap:10px}
.hist li span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.empty{text-align:center;padding:24px 14px;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;align-items:end}
.preview{font-size:14px;white-space:pre-wrap;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:260px;overflow:auto;font-variant-numeric:tabular-nums}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--ink);color:var(--bg);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
.timer b{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.timer button{background:none;border:1.5px solid currentColor;color:inherit;border-radius:8px;padding:6px 12px;font:inherit;font-weight:600;cursor:pointer}
.timer .bar{position:absolute;left:0;top:0;height:3px;background:var(--ok)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ok);color:#fff;padding:8px 16px;border-radius:999px;font-weight:600;z-index:12;max-width:calc(100% - 32px);text-align:center}
.lb{position:fixed;inset:0;z-index:11;background:var(--scrim);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:12px}
.lb img{flex:1;min-height:0;width:100%;object-fit:contain}
.lb .bar2{display:flex;justify-content:space-between;gap:12px}
.lb button{background:none;border:1.5px solid #fff;color:#fff;border-radius:8px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer}
.lb .del{border-color:#FF6253;color:#FF6253}
table.body-t{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.body-t td,table.body-t th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
table.body-t th{font-size:12px;color:var(--muted);font-weight:600}
.quote{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 10px 44px;position:relative;display:grid;gap:4px}
.quote::before{content:"“";position:absolute;left:12px;top:-2px;font-family:Georgia,serif;font-size:52px;line-height:1;color:var(--push)}
.quote p{margin:0;font-size:17px;font-weight:600;line-height:1.45;text-wrap:balance}
.quote .lnk{justify-self:end}
#bgimg{position:fixed;inset:0;z-index:-1;pointer-events:none;background-position:center;background-size:cover}
#bgimg::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:var(--veil,0)}
.bgchips .chip{padding:5px 12px}
.bgchips .chip[aria-pressed="true"]{color:var(--bg)}
input[type="range"]{-webkit-appearance:auto;appearance:auto;background:none;border:0;padding:0;accent-color:var(--ink);width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div id="bgimg" aria-hidden="true"></div>
<header>
  <div class="wrap">
    <div class="brand">
      <h1>推拉腿训练本</h1>
      <div class="plates" aria-hidden="true"><i style="background:var(--push)"></i><i style="background:var(--leg)"></i><i style="background:var(--pull)"></i><i style="background:var(--cardio)"></i></div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-log" aria-selected="true" data-tab="log">训练</button>
      <button role="tab" id="tab-hist" aria-selected="false" data-tab="hist">历史</button>
      <button role="tab" id="tab-body" aria-selected="false" data-tab="body">体重腰围</button>
      <button role="tab" id="tab-exp" aria-selected="false" data-tab="exp">更多</button>
    </nav>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>
<input type="file" id="pick" accept="image/*" multiple hidden>
<input type="file" id="bgpick" accept="image/*" hidden>
<input type="file" id="imp" accept=".json,application/json" hidden>
<div class="lb" id="lb" hidden><img id="lb-img" alt="动作图片"><div class="bar2"><button id="lb-del" class="del">删除这张</button><button id="lb-close">关闭</button></div></div>
<div class="timer" id="timer" hidden><div class="bar" id="timer-bar"></div><div><div style="font-size:12px;opacity:.75">组间休息</div><b id="timer-t">0:00</b></div><div class="mini"><button id="timer-add">+30秒</button><button id="timer-skip">跳过</button></div></div>
<div class="toast" id="toast" hidden></div>

<script>
const TYPES={
  leg:{name:'腿',c:'var(--leg)',ex:[
    {n:'深蹲',sets:4,lo:5,hi:6,inc:2.5,main:1},
    {n:'罗马尼亚硬拉',sets:3,lo:8,hi:8,inc:2.5,main:1},
    {n:'腿举',sets:3,lo:12,hi:12,inc:5},
    {n:'腿弯举',sets:3,lo:12,hi:12,inc:2.5},
    {n:'提踵',sets:4,lo:15,hi:15,inc:5},
    {n:'悬垂举腿',sets:3,lo:12,hi:12,bw:1},
    {n:'哑铃侧平举',sets:3,lo:15,hi:20,inc:1}]},
  push:{name:'推',c:'var(--push)',ex:[
    {n:'卧推',sets:4,lo:5,hi:5,inc:1.25,main:1},
    {n:'站姿杠铃推举',sets:3,lo:6,hi:8,inc:1.25,main:1},
    {n:'上斜哑铃卧推',sets:3,lo:8,hi:12,inc:2},
    {n:'哑铃侧平举',sets:4,lo:15,hi:15,inc:1},
    {n:'绳索下压',sets:3,lo:12,hi:12,inc:2.5}]},
  pull:{name:'拉',c:'var(--pull)',ex:[
    {n:'引体向上',sets:4,lo:null,hi:null,bw:1,main:1,note:'力竭，重量填附加负重'},
    {n:'杠铃划船',sets:4,lo:8,hi:8,inc:2.5,main:1},
    {n:'高位下拉',sets:3,lo:10,hi:12,inc:2.5},
    {n:'面拉',sets:3,lo:15,hi:15,inc:2.5},
    {n:'杠铃弯举',sets:3,lo:10,hi:10,inc:1.25},
    {n:'锤式弯举',sets:2,lo:12,hi:12,inc:1}]},
  bball:{name:'篮球',c:'var(--cardio)',cardio:1},
  swim:{name:'游泳',c:'var(--cardio)',cardio:1}
};
const ORDER=['leg','push','pull','bball'];
const QUOTES=['重量不会说谎，每一组都算数。','今天的酸痛，是下个月的力量。','不用每次都状态最好，只要每次都来。','慢慢加，也是在加。','你和目标之间，只差一次次的“再来一组”。','杠铃不认识借口。','进步是加出来的：2.5公斤，再2.5公斤。','坚持不是不累，是累了还在。','最难的一组，是出门那一步。','别和别人比重量，和上周的自己比。','练不动的时候，把动作做标准就是胜利。','吃好、睡好、练好，剩下的交给时间。','肌肉是慢慢长出来的，自律也是。','今天不想练？先热身，热完再决定。','每一次完成，都是在给更好的自己投票。','计划写在纸上，力量写在身上。','平台期不是终点，是下一次突破前的蓄力。','汗水会干，记录会留下。','别等有精神才练，练了才有精神。','重量是对手，也是老师。','一年后的你，会感谢今天没偷懒的自己。','不必完美，只要比昨天多一点。','减脂靠嘴，增肌靠练，坚持靠心。','你推起的不是杠铃，是昨天的极限。','最好的计划，是你能坚持下去的那个。','动作标准，比重量好看更重要。','休息也是训练的一部分。','先完成，再完美。','状态不好也来了，这就是自律。','今天的你，正在变成想成为的那个人。'];
let quoteOff=0;
function quoteNow(){const d=Math.floor(Date.parse(today())/864e5);return QUOTES[((d+quoteOff)%QUOTES.length+QUOTES.length)%QUOTES.length]}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const md=s=>{const p=s.split('-');return (+p[1])+'/'+(+p[2])};
const num=v=>v===''||v==null||isNaN(+v)?null:+v;
const fmt=n=>n==null?'':(Math.round(n*100)/100).toString();
const e1rm=(w,r)=>r>=1?w*(1+r/30):0;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const tName=t=>(TYPES[t]||{name:t}).name+(TYPES[t]&&!TYPES[t].cardio?'日':'');
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};

/* ---------- images: IndexedDB, stored as compressed JPEG data URLs ---------- */
const IDB={p:null,
  open(){return this.p||(this.p=new Promise((res,rej)=>{try{const r=indexedDB.open('ppl-log',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('imgs'))d.createObjectStore('imgs');if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}))},
  async tx(mode,fn,st='imgs'){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction(st,mode);const q=fn(t.objectStore(st));t.oncomplete=()=>res(q?q.result:undefined);t.onerror=()=>rej(t.error)})},
  put(id,v){return this.tx('readwrite',s=>s.put(v,id))},
  get(id){return this.tx('readonly',s=>s.get(id))},
  del(id){return this.tx('readwrite',s=>s.delete(id))},
  kvPut(k,v){return this.tx('readwrite',s=>s.put(v,k),'kv')},
  kvGet(k){return this.tx('readonly',s=>s.get(k),'kv')}
};
const imgCache={};
async function getImg(id){if(imgCache[id])return imgCache[id];try{const v=await IDB.get(id);if(v)imgCache[id]=v;return v}catch(e){return null}}
function hydrate(){document.querySelectorAll('img[data-img]:not([src])').forEach(async el=>{const v=await getImg(el.dataset.img);if(v)el.src=v})}
async function shrink(file){
  const url=URL.createObjectURL(file);const img=new Image();
  await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=url});
  const sc=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
  return c.toDataURL('image/jpeg',0.8);
}
function thumbs(ids,ctx,i,sm){return '<div class="thumbs'+(sm?' sm':'')+'">'+(ids||[]).map(id=>'<button class="thumb" data-act="view" data-id="'+esc(id)+'" data-ctx="'+ctx+'"'+(i!=null?' data-i="'+i+'"':'')+' aria-label="查看图片"><img data-img="'+esc(id)+'" alt=""></button>').join('')+(ctx==='draft'?'<button class="thumb add" data-act="add-img" data-i="'+i+'">+ 图片</button>':'')+'</div>'}
function refsInUse(){const s=new Set();store.sessions.forEach(x=>(x.entries||[]).forEach(e=>(e.imgs||[]).forEach(id=>s.add(id))));if(draft&&draft.entries)draft.entries.forEach(e=>(e.imgs||[]).forEach(id=>s.add(id)));return s}
async function dropUnused(ids){const used=refsInUse();for(const id of ids){if(!used.has(id)){delete imgCache[id];try{await IDB.del(id)}catch(e){}}}}

/* ---------- backgrounds: drawn on canvas in the current theme's colours, or the viewer's own photo ---------- */
const BGS={none:'无',plates:'杠铃片',knurl:'防滑纹',chalk:'镁粉',photo:'我的照片'};
const bgCache={};
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function tok(k){return getComputedStyle(document.documentElement).getPropertyValue(k).trim()||'#888'}
function drawBg(kind){
  const dark=tok('--bg').toLowerCase()<'#7';const key=kind+(dark?'d':'l');if(bgCache[key])return bgCache[key];
  const c=document.createElement('canvas');const g=c.getContext('2d');const R=rng(7);let out;
  if(kind==='knurl'){c.width=c.height=48;g.strokeStyle=tok('--ink');g.globalAlpha=dark?.10:.07;g.lineWidth=1.2;
    for(let i=-48;i<=96;i+=12){g.beginPath();g.moveTo(i,0);g.lineTo(i+48,48);g.stroke();g.beginPath();g.moveTo(i+48,0);g.lineTo(i,48);g.stroke()}
    out={url:c.toDataURL(),repeat:true}}

function lastEntry(name){for(const s of store.sessions){const e=(s.entries||[]).find(x=>x.name===name);if(e)return{date:s.date,e}}return null}
function suggest(ex){
  const L=lastEntry(ex.n);
  if(!L) return {w:ex.bw?0:'',text:ex.bw?'自重':'首次：选能标准完成、还留2–3次余力的重量',cls:''};
  const done=L.e.sets.filter(s=>num(s.r)!=null);
  const ws=done.map(s=>num(s.w)??0);const top=ws.length?Math.max(...ws):0;
  const line='上次 '+md(L.date)+' · '+(done.length?done.map(s=>(ex.bw&&!num(s.w)?'自重':fmt(num(s.w)))+'×'+s.r).join('  '):'未记录');
  if(ex.lo==null){const tot=done.reduce((a,s)=>a+(+s.r),0);return {w:top,last:line,text:'上次共 '+tot+' 个，这次争取多做1个',cls:'up'}}
  const atTop=done.filter(s=>(num(s.w)??0)>=top);
  const allHit=atTop.length>=ex.sets&&atTop.every(s=>+s.r>=ex.hi);
  const below=atTop.some(s=>+s.r<ex.lo);
  if(allHit&&!ex.bw) return {w:+(top+ex.inc).toFixed(2),last:line,text:'上次全部完成 → 加 '+ex.inc+'kg',cls:'up'};
  if(below) return {w:top,last:line,text:'上次有组没到 '+ex.lo+' 次，保持重量',cls:'hold'};
  return {w:top,last:line,text:ex.lo===ex.hi?'保持重量，把每组做满':'保持重量，争取每组做到 '+ex.hi+' 次',cls:'hold'};
}

function chart(pts,opt){
  const W=340,H=170,L=34,R=10,T=12,B=24;
  const xs=pts.map(p=>p.x).concat(opt.xExtra||[]);const ys=pts.map(p=>p.y).concat(opt.yExtra||[]);
  if(!xs.length||!ys.length)return'';
  let x0=Math.min(...xs),x1=Math.max(...xs);if(x1-x0<864e5*7){x1=x0+864e5*7}
  let y0=Math.floor((Math.min(...ys)-opt.padY)/opt.step)*opt.step,y1=Math.ceil((Math.max(...ys)+opt.padY)/opt.step)*opt.step;if(y1===y0)y1=y0+opt.step;
  const sx=x=>L+(x-x0)/(x1-x0)*(W-L-R),sy=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  let g='';for(let y=y0;y<=y1+1e-9;y+=opt.step){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+sy(y)+'" y2="'+sy(y)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(sy(y)+4)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+fmt(y)+'</text>'}
  const d0=new Date(x0),d1=new Date(x1);
  g+='<text x="'+L+'" y="'+(H-6)+'" font-size="10" fill="var(--muted)">'+(d0.getMonth()+1)+'/'+d0.getDate()+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+(d1.getMonth()+1)+'/'+d1.getDate()+'</text>';
  (opt.goals||[]).forEach(q=>{g+='<circle cx="'+sx(q.x)+'" cy="'+sy(q.y)+'" r="5" fill="var(--surface)" stroke="'+opt.color+'" stroke-width="2" stroke-dasharray="2 2"/><text x="'+(sx(q.x)-8)+'" y="'+(sy(q.y)-8)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+q.label+'</text>'});
  if(opt.line&&opt.line.length>1)g+='<polyline fill="none" stroke="'+opt.color+'" stroke-width="2.5" stroke-linejoin="round" points="'+opt.line.map(p=>sx(p.x)+','+sy(p.y)).join(' ')+'"/>';
  else if(!opt.line&&pts.length>1)g+='<polyline fill="none" stroke="'+opt.color+'" stroke-width="2.5" stroke-linejoin="round" points="'+pts.map(p=>sx(p.x)+','+sy(p.y)).join(' ')+'"/>';
  pts.forEach((p,i)=>{const last=i===pts.length-1;g+='<circle cx="'+sx(p.x)+'" cy="'+sy(p.y)+'" r="'+(last?4.5:3)+'" fill="'+opt.color+'"'+(opt.line?' opacity="'+(last?1:.45)+'"':'')+'/>'});
  return'<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.label)+'">'+g+'</svg></div>';
}

  return h;
}

/* ---------- export ---------- */
function sessionText(s){
  const T=TYPES[s.type]||{name:s.type};
  let t=s.date+' '+tName(s.type)+'\n';
  if(T.cardio)t+=T.name+' '+(s.minutes||'?')+'分钟'+(s.feel?'，'+s.feel:'')+'\n';
  else (s.entries||[]).forEach(e=>{t+=e.name+'  '+setsText(e)+'\n'});
  if(s.notes)t+='备注：'+s.notes+'\n';
  return t;
}
function dayText(date){
  const ss=store.sessions.filter(s=>s.date===date).slice().reverse();const b=store.body.find(x=>x.date===date);
  let t='';ss.forEach(s=>t+=sessionText(s)+'\n');
  if(b)t+=date+' 身体：'+(b.weight?'体重 '+b.weight+'kg':'')+(b.waist?(b.weight?'，':'')+'腰围 '+b.waist+'cm':'')+'\n';
  return t.trim();
}
async function reportHtml(sessions,bodyRows,title){
  const css='body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:680px;margin:0 auto;padding:20px 16px;color:#14171B;background:#fff;line-height:1.5}h1{font-size:24px;margin:0 0 4px}.s{border-top:2px solid #14171B;padding:12px 0;margin-top:12px}.s h2{font-size:18px;margin:0 0 6px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:4px 6px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}.im{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.im img{width:160px;max-width:100%;border-radius:6px}.n{color:#5D6570;font-size:13px}';
  let h='<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(title)+'</title><style>'+css+'</style></head><body><h1>'+esc(title)+'</h1><p class="n">导出于 '+new Date().toLocaleString('zh-CN')+' · 推拉腿训练本</p>';
  for(const s of sessions){
    const T=TYPES[s.type]||{name:s.type};
    h+='<div class="s"><h2>'+esc(s.date)+' '+esc(tName(s.type))+'</h2>';
    if(T.cardio)h+='<p>'+esc(T.name)+' '+esc(s.minutes||'?')+' 分钟'+(s.feel?' · '+esc(s.feel):'')+'</p>';
    else{h+='<table><tr><th>动作</th><th>重量 × 次数</th></tr>';
      for(const e of s.entries||[]){let im='';for(const id of e.imgs||[]){const v=await getImg(id);if(v)im+='<img src="'+v+'" alt="">'}
        h+='<tr><td>'+esc(e.name)+'</td><td>'+esc(setsText(e))+(im?'<div class="im">'+im+'</div>':'')+'</td></tr>'}
      h+='</table>'}
    if(s.notes)h+='<p class="n">备注：'+esc(s.notes)+'</p>';
    h+='</div>';
  }
  if(bodyRows.length){h+='<div class="s"><h2>体重腰围</h2><table><tr><th>日期</th><th>体重 kg</th><th>腰围 cm</th></tr>'+bodyRows.map(b=>'<tr><td>'+esc(b.date)+'</td><td>'+esc(b.weight||'—')+'</td><td>'+esc(b.waist||'—')+'</td></tr>').join('')+'</table></div>'}
  return h+'</body></html>';
}
let dlP=null;
function getDownloads(){if(!dlP)dlP=(window.claude&&window.claude.use)?window.claude.use('downloads').catch(()=>null):Promise.resolve(null);return dlP}
async function saveFile(name,content,mime){
  const dl=await getDownloads();
  if(dl){try{await dl.save({filename:name,data:new Blob([content],{type:mime})});toast('已导出');return true}
    catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited'){toast('稍等一下再试');return}}}
  if(window.claude){toast('这个页面不能下载文件，请用“复制文字”');return}
  const file=new File([content],name,{type:mime});
  const touch='ontouchend' in document;
  if(touch&&navigator.canShare&&navigator.share){try{if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true}}catch(e){if(e&&e.name==='AbortError')return}}
  try{const u=URL.createObjectURL(file);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('已导出 '+name);return true}
  catch(e){toast('这个浏览器不支持下载，请用“复制文字”')}
}

    '<p class="note" style="margin:0">选“我的照片”可以用健身房、偶像或者目标身材的照片当背景。照片只存在这台手机里。</p></div>'+

    '<p class="note" style="margin:0">版本 '+(typeof APP_VER!=='undefined'?APP_VER:'')+'，有新版本时打开就会自动更新。</p><p class="note" style="margin:0">用 Safari 的话，建议点分享按钮 → “添加到主屏幕”，从主屏幕图标打开。直接在网页里用，长时间不打开 Safari 可能会清掉数据。</p></div>';
}

/* ---------- rest timer, toast, lightbox ---------- */
let tEnd=0,tLen=0,tInt=null;
function startTimer(sec){tLen=sec;tEnd=Date.now()+sec*1000;$('#timer').hidden=false;clearInterval(tInt);tick();tInt=setInterval(tick,250)}
function tick(){const left=Math.max(0,Math.round((tEnd-Date.now())/1000));$('#timer-t').textContent=Math.floor(left/60)+':'+pad(left%60);$('#timer-bar').style.width=(100*(1-left/tLen))+'%';if(left<=0){clearInterval(tInt);$('#timer-t').textContent='开始下一组';setTimeout(()=>{if(Date.now()>=tEnd)$('#timer').hidden=true},4000)}}
$('#timer-skip').onclick=()=>{clearInterval(tInt);$('#timer').hidden=true};
$('#timer-add').onclick=()=>{tEnd+=30000;tLen+=30};
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2400)}
let lbCtx=null;
async function openLb(id,ctx,i){lbCtx={id,ctx,i};$('#lb-img').src=(await getImg(id))||'';$('#lb-del').hidden=ctx!=='draft';$('#lb').hidden=false}
$('#lb-close').onclick=()=>{$('#lb').hidden=true;$('#lb-img').removeAttribute('src')};
$('#lb-del').onclick=async()=>{const {id,i}=lbCtx;const en=draft.entries[i];en.imgs=(en.imgs||[]).filter(x=>x!==id);saveDraft();$('#lb').hidden=true;await dropUnused([id]);render()};

/* ---------- events ---------- */
let pickFor=null;
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;confirmId=null;render();window.scrollTo(0,0)});
$('#view').addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='x-date'){expDate=t.value||today();render();return}
  if(!draft)return;
  if(t.id==='d-date')draft.date=t.value;
  else if(t.id==='d-notes')draft.notes=t.value;
  else if(t.id==='c-min')draft.minutes=t.value;
  else if(t.id==='c-feel')draft.feel=t.value;
  else if(t.dataset.f){const [i,j]=t.closest('.set').dataset.set.split('-').map(Number);draft.entries[i].sets[j][t.dataset.f]=t.value}
  else return;
  saveDraft();
});
$('#view').addEventListener('change',e=>{if(e.target.id==='c-feel'){draft.feel=e.target.value;saveDraft()}});
$('#pick').addEventListener('change',async e=>{
  const files=[...e.target.files];e.target.value='';if(!files.length||pickFor==null||!draft.entries[pickFor])return;
  const en=draft.entries[pickFor];en.imgs=en.imgs||[];let n=0;
  for(const f of files){try{const v=await shrink(f);const id='img-'+uid();await IDB.put(id,v);imgCache[id]=v;en.imgs.push(id);n++}catch(err){toast('有一张图片读不了，换一张试试')}}
  saveDraft();render();if(n)toast('已添加 '+n+' 张图片');
});
$('#bgpick').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const v=await shrink(f);await IDB.put('bg-custom',v);imgCache['bg-custom']=v;ls.set('bg','photo');await applyBg();render();toast('背景已换好')}catch(_){toast('这张照片读不了，换一张试试')}
});
$('#view').addEventListener('input',e=>{if(e.target.id==='veil'){ls.set('veil',+e.target.value);$('#bgimg').style.setProperty('--veil',e.target.value)}});
$('#imp').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.sessions)||!Array.isArray(d.body))throw 0;
    const m=(a,b)=>{const o={};a.concat(b).forEach(x=>{if(x&&x.id)o[x.id]=x});return Object.values(o)};
    for(const [id,v] of Object.entries(d.imgs||{})){if(typeof v==='string'&&v.startsWith('data:image/')){await IDB.put(id,v);imgCache[id]=v}}
    store.sessions=m(store.sessions,d.sessions);store.body=m(store.body,d.body);if(d.goal)ls.set('goal',d.goal);sortAll();persist();
    toast('已导入 '+d.sessions.length+' 次训练');render()}catch(_){toast('这个文件不是训练备份')}};
  r.readAsText(f);
});
$('#view').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.type){const k=b.dataset.type;if(k!==draft.type){await replaceDraft(newDraft(k,draft.date));render()}return}
  const a=b.dataset.act;
  if(a==='done'){
    const row=b.closest('.set');const [i,j]=row.dataset.set.split('-').map(Number);const s=draft.entries[i].sets[j];const ex=exDef(draft.type,draft.entries[i].name);
    s.d=!s.d;
    if(s.d&&s.r===''&&ex.lo!=null){s.r=String(ex.lo);row.querySelector('[data-f="r"]').value=s.r}
    if(s.d&&s.r===''){s.d=false;row.querySelector('[data-f="r"]').focus();toast('先填上这组做了几个');return}
    row.classList.toggle('done',s.d);b.setAttribute('aria-pressed',s.d);saveDraft();
    if(s.d)startTimer(ex.main?150:75);
  }
  else if(a==='add-img'){pickFor=+b.dataset.i;$('#pick').click()}
  else if(a==='view'){openLb(b.dataset.id,b.dataset.ctx,b.dataset.i!=null?+b.dataset.i:null)}
  else if(a==='add-set'){const en=draft.entries[+b.dataset.i];const l=en.sets[en.sets.length-1];en.sets.push({w:l?l.w:'',r:'',d:false});saveDraft();render()}
  else if(a==='rm-set'){draft.entries[+b.dataset.i].sets.pop();saveDraft();render()}
  else if(a==='rm-ex'){const gone=draft.entries.splice(+b.dataset.i,1)[0];saveDraft();await dropUnused(gone.imgs||[]);render()}
  else if(a==='add-ex'){const v=$('#add-ex').value.trim();if(!v)return;const L=lastEntry(v);draft.entries.push({name:v,imgs:[],sets:Array.from({length:3},()=>({w:L?L.e.sets[0].w:'',r:'',d:false}))});saveDraft();render()}
  else if(a==='reset'){await replaceDraft(newDraft(draft.type,draft.date));render()}
  else if(a==='finish'){
    const T=TYPES[draft.type];const o={id:draft.date+'-'+draft.type+'-'+uid(),date:draft.date,type:draft.type,at:new Date().toISOString(),notes:draft.notes||''};
    if(T.cardio){o.minutes=num(draft.minutes);o.feel=draft.feel||''}
    else{o.entries=draft.entries.map(en=>({name:en.name,imgs:en.imgs||[],sets:en.sets.filter(s=>num(s.r)!=null).map(s=>({w:s.w,r:s.r}))})).filter(en=>en.sets.length||en.imgs.length);
      if(!o.entries.length){toast('还没有填任何一组');return}}
    store.sessions.push(o);sortAll();if(!persist()){store.sessions=store.sessions.filter(x=>x!==o);return}
    clearInterval(tInt);$('#timer').hidden=true;
    const leftover=draft.entries?draft.entries.filter(en=>!o.entries.some(x=>x.name===en.name)).flatMap(en=>en.imgs||[]):[];
    draft=newDraft(nextType());saveDraft();if(leftover.length)await dropUnused(leftover);
    quoteOff++;toast('已保存！'+quoteNow());render();window.scrollTo(0,0);
  }
  else if(a==='save-goal'){ls.set('goal',{w:$('#g-w').value.trim(),d:$('#g-d').value});mirror();toast('目标已保存');render()}
  else if(a==='ask-del'){confirmId=b.dataset.id;render()}
  else if(a==='cancel'){confirmId=null;render()}
  else if(a==='del'){const s=store.sessions.find(x=>x.id===b.dataset.id);confirmId=null;store.sessions=store.sessions.filter(x=>x!==s);persist();if(s)await dropUnused((s.entries||[]).flatMap(en=>en.imgs||[]));toast('已删除');render()}
  else if(a==='del-body'){confirmId=null;store.body=store.body.filter(x=>x.id!==b.dataset.id);persist();toast('已删除');render()}
  else if(a==='save-body'){
    const date=$('#b-date').value||today(),w=$('#b-w').value.trim(),waist=$('#b-waist').value.trim();
    if(!w&&!waist){toast('填体重或腰围');return}
    if((w&&num(w)==null)||(waist&&num(waist)==null)){toast('请输入数字');return}
    const prev=store.body.find(x=>x.id===date)||{};
    store.body=store.body.filter(x=>x.id!==date);store.body.push({id:date,date,weight:w||prev.weight||'',waist:waist||prev.waist||''});sortAll();persist();toast('已记录');render();
  }
  else if(a==='copy-day'){
    const t=dayText(expDate);
    try{await navigator.clipboard.writeText(t);toast('已复制，可以粘贴了')}
    catch(_){const el=$('#x-text');const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('已选中文字，长按复制')}
  }
  else if(a==='exp-day'){b.disabled=true;const ss=store.sessions.filter(s=>s.date===expDate).slice().reverse();const html=await reportHtml(ss,store.body.filter(x=>x.date===expDate),'训练记录 '+expDate);b.disabled=false;await saveFile('训练记录-'+expDate+'.html',html,'text/html')}
  else if(a==='exp-all'){b.disabled=true;const html=await reportHtml(store.sessions,store.body,'全部训练记录');b.disabled=false;await saveFile('全部训练记录-'+today()+'.html',html,'text/html')}
  else if(a==='backup'){
    b.disabled=true;const imgs={};for(const id of refsInUse()){const v=await getImg(id);if(v)imgs[id]=v}
    const data=JSON.stringify({app:'ppl-log',v:2,exported:new Date().toISOString(),sessions:store.sessions,body:store.body,goal:ls.get('goal',null),imgs});
    b.disabled=false;if(await saveFile('训练备份-'+today()+'.json',data,'application/json')){ls.set('lastBackup',Date.now());render()}
  }
  else if(a==='import'){$('#imp').click()}
  else if(a==='next-quote'){quoteOff++;const el=$('#q-text');if(el)el.textContent=quoteNow()}
  else if(b.dataset.bg){const k=b.dataset.bg;if(k==='photo'){const has=await getImg('bg-custom');if(!has){$('#bgpick').click();return}}ls.set('bg',k);await applyBg();render()}
  else if(a==='bg-photo'){$('#bgpick').click()}
  else if(a==='go-backup'){tab='exp';render();window.scrollTo(0,0)}
});
getDownloads();render();applyBg();restoreFromMirror().then(r=>{if(r){toast('已从备用存储恢复记录');draft=null;render()}else if(store.sessions.length||store.body.length)mirror()});
</script>
